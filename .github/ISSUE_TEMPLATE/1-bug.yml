name: 🐞 Bug
description: Şematikte veya layout'ta bulunan bir sorun
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: board
    attributes:
      label: Kart / alan
      options: [Güç kartı, Sürücü kartı, Ana kart, Firmware, Diğer]
    validations: {required: true}
  - type: input
    id: rev
    attributes:
      label: Commit
      description: Sorun hangi commit'te görülüyor?
      placeholder: "4aabb87"
    validations: {required: true}
  - type: dropdown
    id: stage
    attributes:
      label: Nerede bulundu
      options: [Şematik review, Layout review, ERC/DRC]
  - type: textarea
    id: what
    attributes:
      label: Sorun ne?
      description: Beklenen davranış vs. gerçekte olan
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: Kanıt
      description: Hesaplar, şematik/layout ekran görüntüleri, DRC/ERC çıktısı (sürükle bırak)
  - type: textarea
    id: fix
    attributes:
      label: Olası çözüm
  - type: dropdown
    id: when
    attributes:
      label: Ne zaman düzeltilecek?
      options: [Şimdi, Robot kol aşamasına ertele, Karar verilmedi]
