name: 🐞 Bug
description: Şematikte, layout'ta, kartta veya firmware'de bulunan bir sorun
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: board
    attributes:
      label: Kart / alan
      options: [Güç kartı, Sürücü kartı, Ana kart, Firmware, Diğer]
    validations: {required: true}
  - type: input
    id: rev
    attributes:
      label: Revizyon / commit
      description: Sorun hangi kart revizyonunda veya commit'te görülüyor?
      placeholder: "Rev A / power-rev-a / 4aabb87"
    validations: {required: true}
  - type: dropdown
    id: stage
    attributes:
      label: Nerede bulundu
      options: [Şematik review, Layout review, ERC/DRC, Bring-up / test, Normal çalışma]
  - type: textarea
    id: what
    attributes:
      label: Sorun ne?
      description: Beklenen davranış vs. gerçekte olan
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: Kanıt
      description: Ölçümler, osiloskop görüntüleri, şematik/layout ekran görüntüleri (sürükle bırak)
  - type: textarea
    id: fix
    attributes:
      label: Olası çözüm
  - type: dropdown
    id: when
    attributes:
      label: Ne zaman düzeltilecek?
      options: [Bu revizyonda, Rev B'ye ertele, Karar verilmedi]
