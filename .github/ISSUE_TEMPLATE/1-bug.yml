name: 🐞 Bug
description: A problem found in the schematic, layout, board or firmware
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: board
    attributes:
      label: Board / area
      options: [Power board, Driver board, Main board, Firmware, Other]
    validations: {required: true}
  - type: input
    id: rev
    attributes:
      label: Revision / commit
      description: Which board revision or commit shows the problem?
      placeholder: "Rev A / power-rev-a / 4aabb87"
    validations: {required: true}
  - type: dropdown
    id: stage
    attributes:
      label: Found during
      options: [Schematic review, Layout review, ERC/DRC, Bring-up / test, Normal operation]
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: Expected behavior vs. what actually happens
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Measurements, scope captures, schematic/layout screenshots (drag & drop)
  - type: textarea
    id: fix
    attributes:
      label: Possible fix
  - type: dropdown
    id: when
    attributes:
      label: When will it be fixed?
      options: [This revision, Defer to Rev B, Not decided]
