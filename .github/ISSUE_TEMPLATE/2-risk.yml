name: ⚠️ Risk
description: Henüz bug değil ama ileride sorun çıkarabilir — analiz ve karar gerekiyor
title: "[RISK] "
labels: ["risk"]
body:
  - type: dropdown
    id: board
    attributes:
      label: Kart / alan
      options: [Güç kartı, Sürücü kartı, Ana kart, Firmware, Sistem]
    validations: {required: true}
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: Ne olabilir, hangi koşullarda ve sonucu ne olur?
    validations: {required: true}
  - type: textarea
    id: analysis
    attributes:
      label: Analiz
      description: Gereken hesaplar / ölçümler / araştırma (checklist olarak)
      value: |
        - [ ] 
  - type: textarea
    id: decision
    attributes:
      label: Karar
      description: Analizden sonra doldur
