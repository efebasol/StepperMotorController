name: ⚠️ Risk
description: Not a bug yet, but could cause problems later — needs analysis and a decision
title: "[RISK] "
labels: ["risk"]
body:
  - type: dropdown
    id: board
    attributes:
      label: Board / area
      options: [Power board, Driver board, Main board, Firmware, System]
    validations: {required: true}
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: What could happen, under which conditions, and what's the consequence?
    validations: {required: true}
  - type: textarea
    id: analysis
    attributes:
      label: Analysis
      description: Calculations / measurements / research needed (as a checklist)
      value: |
        - [ ] 
  - type: textarea
    id: decision
    attributes:
      label: Decision
      description: Fill in after the analysis
