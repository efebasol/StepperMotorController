name: ⚠️ Öngörülen risk
description: Henüz hata değil ama ileride sorun çıkarabilecek bir durum — analiz ve karar gerekli
title: "[RİSK] "
labels: ["risk"]
body:
  - type: dropdown
    id: board
    attributes:
      label: Kart / alan
      options: [Güç kartı, Sürücü kartı, Ana kart, Firmware, Sistem]
    validations: {required: true}
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: Ne olabilir, hangi koşulda, sonucu ne olur?
    validations: {required: true}
  - type: textarea
    id: analysis
    attributes:
      label: Analiz
      description: Yapılması gereken hesap / ölçüm / araştırma (checklist olarak yazabilirsin)
      value: |
        - [ ] 
  - type: textarea
    id: decision
    attributes:
      label: Karar
      description: Analiz sonrası doldurulacak
