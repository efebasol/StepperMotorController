name: 🛠️ Görev
description: Bir iş (şematik, layout, firmware, test, doküman)
labels: []
body:
  - type: dropdown
    id: board
    attributes:
      label: Kart / alan
      options: [Güç kartı, Sürücü kartı, Ana kart, Firmware, Doküman, Diğer]
    validations: {required: true}
  - type: textarea
    id: goal
    attributes:
      label: Hedef
      description: Bu bitince ne değişmiş olacak?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Adımlar
      value: |
        - [ ] 
  - type: input
    id: blocked
    attributes:
      label: Bağımlılıklar
      placeholder: "#... tarafından engelleniyor"
