name: 🛠️ Task
description: A piece of work (schematic, layout, firmware, test, docs)
labels: []
body:
  - type: dropdown
    id: board
    attributes:
      label: Board / area
      options: [Power board, Driver board, Main board, Firmware, Docs, Other]
    validations: {required: true}
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What will be different once this is done?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps
      value: |
        - [ ] 
  - type: input
    id: blocked
    attributes:
      label: Dependencies
      placeholder: "Blocked by #..."
