name: Hardware CI

# On every push: ERC, DRC, schematic PDF, BOM, Gerber, CPL
on:
  push:
    paths: ["hardware/**", "ci/**", ".github/workflows/hardware-ci.yml"]
  pull_request:
    paths: ["hardware/**"]
  workflow_dispatch:

env:
  # Set to 1 to fail on ERC/DRC errors. Keep 0 until layout is done: report + warnings only.
  STRICT: "0"

jobs:
  check:
    name: ${{ matrix.board }}
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0-full   # -full: includes the standard symbol/footprint libraries
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        board: [power, driver]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq zip python3 >/dev/null
      - name: KiCad library tables
        # Install KiCad's default global symbol/footprint tables (standard libs: Device, power, Resistor_SMD, …)
        run: |
          mkdir -p /root/.config/kicad/10.0
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table /root/.config/kicad/10.0/
          echo "::notice title=KiCad libs::$(grep -c '(lib ' /root/.config/kicad/10.0/sym-lib-table) symbol libs, $(grep -c '(lib ' /root/.config/kicad/10.0/fp-lib-table) footprint libs"
      - name: ERC / DRC / outputs
        env:
          HOME: /root
        run: bash ci/kicad_check.sh hardware/${{ matrix.board }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-outputs
          path: ci-out/${{ matrix.board }}
          retention-days: 30
